# Baked into the image at /home/claude/.codex/config.toml (see Containerfile).
# No internal sandboxing/approval prompts: the podman container itself is
# the real isolation boundary (host filesystem/network are untouched
# regardless), so Codex's own sandbox on top of that just adds prompts
# without adding safety.
sandbox_mode = "danger-full-access"
approval_policy = "never"

# Default to GPT-6 Luna (cheap) instead of Codex's own recommended default
# (Sol). GPT-6 has no Terra tier; gpt-5.6-terra gets auto-upgraded to Sol.
model = "gpt-6-luna"

# Codex offers a "new model" migration (Terra -> GPT-6 Luna) on startup and
# records the answer here — but the container is --rm, so the answer never
# persisted and the prompt returned every session. Pre-acknowledge it
# (old -> new slug, Codex's own format) to keep Terra without the nag.
# GPT-6 Luna benchmarks worse than Terra, so we deliberately stay put.
[notice.model_migrations]
"gpt-5.6-terra" = "gpt-6-luna"

# Restrict to API-key auth (the only kind this sandbox provides): "apikey" /
# preferred_auth_method aren't real config keys (verified against upstream
# source — codex-rs/protocol/src/config_types.rs), the real one is
# forced_login_method = "api"/"chatgpt". This alone does not skip the login
# screen — entrypoint.sh's `codex login --with-api-key` does that by
# pre-writing auth.json — it just keeps ChatGPT off the menu if that step
# were ever skipped.
forced_login_method = "api"

# Red Hat's EnMaaS gateway (OpenAI-compatible Responses API). Selected via
# the `enmaas` (GPT, default), `enmaas-glm` (--glm) or `enmaas-deepseek`
# (--deepseek) profile, which
# codex::sandbox::_run passes; ENMAAS_KEY is only set in those modes.
# --openai mode skips the profiles and uses the OpenAI defaults above.
[model_providers.enmaas]
name = "EnMaaS"
base_url = "https://api.enmaas.devshift.net/v1"
env_key = "ENMAAS_KEY"
wire_api = "responses"

# Skip the per-directory trust prompt: cwd inside the container is always
# /workspace regardless of which host worktree is mounted, so this one
# entry covers every worktree permanently.
[projects."/workspace"]
trust_level = "trusted"

# gopls (Go language server) via mcp-language-server, so Codex can navigate
# Go code semantically (definitions/references/hover/diagnostics) instead
# of relying on grep. Both binaries are `go install`ed into
# /home/claude/.local/bin in the Containerfile. Workspace is hardcoded to
# /workspace since that's always the mount point for the current worktree
# (see the "cwd inside the container is always /workspace" note above).
[mcp_servers.gopls]
command = "mcp-language-server"
args = ["--workspace", "/workspace", "--lsp", "gopls"]

# Closest approximation of the Claude statusline's model/git/dir/context
# line — Codex only supports picking from a fixed list of built-in items,
# no custom script/colors/cost/duration/lines-changed.
[tui]
status_line = [
    "model-with-reasoning",
    "git-branch",
    "branch-changes",
    "current-dir",
    "context-used",
]

# Codex overwrites the terminal title on every spinner tick, so a title set
# externally (e.g. from the launching fish function) gets clobbered the
# instant Codex starts rendering. "thread" is Codex's own auto-generated
# short summary of the session (from the initial prompt, via a hidden LLM
# call) — closest equivalent to Claude's `--name`, and it composes with the
# spinner instead of racing it.
terminal_title = ["spinner", "thread"]

# WakaTime heartbeats, same claude-code-wakatime binary the Claude hooks use
# (Codex hook stdin carries the same session_id/transcript_path/cwd/
# hook_event_name fields it reads). ~/.wakatime.cfg is mounted by
# codex::sandbox::_run. Codex transcripts aren't Claude-shaped, so heartbeats
# land as the generic "claude code" app entity with the project folder.
[[hooks.SessionStart]]
[[hooks.SessionStart.hooks]]
type = "command"
command = "claude-code-wakatime"

[[hooks.UserPromptSubmit]]
[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "claude-code-wakatime"

[[hooks.PreToolUse]]
matcher = "*"
[[hooks.PreToolUse.hooks]]
type = "command"
command = "claude-code-wakatime"

[[hooks.PostToolUse]]
matcher = "*"
[[hooks.PostToolUse.hooks]]
type = "command"
command = "claude-code-wakatime"

[[hooks.Stop]]
[[hooks.Stop.hooks]]
type = "command"
command = "claude-code-wakatime"

# Recorded hook trust decisions (what `/hooks` writes). The container is --rm,
# so without these Codex asks to review the hooks above on every launch.
# Hashes cover the hook definitions above: if you change a hook, re-trust via
# `/hooks` in a sandbox session and update the matching entry here.
[hooks.state."/home/claude/.codex/config.toml:session_start:0:0"]
trusted_hash = "sha256:3a609d4596457b13605e6b90cc121c55268610f80a7ffd09f225bcf951d8745f"

[hooks.state."/home/claude/.codex/config.toml:user_prompt_submit:0:0"]
trusted_hash = "sha256:f0adacfd2aa9c6acaa17fade7790dde4a32e662400b17fe127156e58b3530a52"

[hooks.state."/home/claude/.codex/config.toml:pre_tool_use:0:0"]
trusted_hash = "sha256:9434723b8e9c3c4fa4e759a29fd5e41ce0c0088980a4ded862366f208c5d719a"

[hooks.state."/home/claude/.codex/config.toml:post_tool_use:0:0"]
